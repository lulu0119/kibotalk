name: macOS Apple Silicon release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build ad-hoc signed arm64 DMG
        run: pnpm --filter @kibotalk/desktop package:mac
      - name: Verify package
        run: |
          APP_PATH="$(find apps/desktop/dist -type d -name 'KiboTalk.app' | head -1)"
          DMG_PATH="$(find apps/desktop/dist -type f -name '*.dmg' | head -1)"
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -F "Signature=adhoc"
          file "$APP_PATH/Contents/MacOS/KiboTalk" | grep arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP_PATH/Contents/Info.plist")" = "13.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsArbitraryLoads' "$APP_PATH/Contents/Info.plist")" = "false"
          hdiutil verify "$DMG_PATH"
          shasum -a 256 "$DMG_PATH" > "${DMG_PATH}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: KiboTalk-macos-arm64
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.sha256
          if-no-files-found: error
      - name: Upload GitHub Release backup
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_NOTES_PATH="docs/releases/${GITHUB_REF_NAME}.md"
          test -s "$RELEASE_NOTES_PATH"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file "$RELEASE_NOTES_PATH"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "$RELEASE_NOTES_PATH"
          fi
          gh release upload "${GITHUB_REF_NAME}" apps/desktop/dist/*.dmg apps/desktop/dist/*.sha256 --clobber

name: GitHub Pages

on:
  push:
    branches: [main, pages-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/configure-pages@v5
        id: pages
      - run: pnpm install --frozen-lockfile
      - name: Build static sites
        env:
          PAGES_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          pnpm --filter @kibotalk/landing build --base "${PAGES_PATH}/"
          pnpm --filter @kibotalk/web build --base "${PAGES_PATH}/app/"
          pnpm --filter @kibotalk/playground build --base "${PAGES_PATH}/playground/"
          mkdir -p _site/app _site/playground
          cp -R apps/landing/dist/. _site/
          cp -R apps/web/dist/. _site/app/
          cp -R apps/playground/dist/. _site/playground/
          cp THIRD_PARTY_NOTICES.md _site/
          for page in _site/{en,ja,zh}/index.html; do
            sed -i "s|https://kibotalk.app/|${PAGES_ORIGIN}${PAGES_PATH}/|g" "$page"
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

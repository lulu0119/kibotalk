<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>KiboTalk</title>
    <script>
      (() => {
        const supported = new Set(['zh', 'ja', 'en'])
        let saved
        try { saved = localStorage.getItem('kibotalk-landing-language') } catch {}
        const browserLanguage = navigator.languages?.[0] ?? navigator.language ?? 'en'
        const detected = browserLanguage.toLowerCase().split('-')[0]
        const language = supported.has(saved)
          ? saved
          : supported.has(detected)
            ? detected
            : 'en'
        window.location.replace(`%BASE_URL%${language}/${window.location.search}${window.location.hash}`)
      })()
    </script>
  </head>
  <body>
    <noscript>
      <p>
        <a href="%BASE_URL%en/">English</a>
        <a href="%BASE_URL%ja/">日本語</a>
        <a href="%BASE_URL%zh/">中文</a>
      </p>
    </noscript>
  </body>
</html>
